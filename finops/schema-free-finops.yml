  - Cost Management
  - FOCUS
description: FinOps framework definition for the Schema Free API surface. Provides a FOCUS-aligned mapping
  for cost allocation, usage measurement, and unit-economics reporting across the provider's APIs.
principles:
  - name: Visibility
    description: Make API consumption costs visible to engineering, product, and finance teams in near
      real-time.
  - name: Allocation
    description: Tag every chargeable API call with the consuming team, environment, application, and
      feature so cost can be allocated.
  - name: Optimization
    description: Continuously evaluate request patterns, caching, batching, and tier selection to reduce
      cost per useful unit of work.
  - name: Accountability
    description: Establish budget owners and chargeback or showback flows for each consuming team.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
      - Anomaly Management
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Forecasting
      - Budgeting
      - Benchmarking
      - Unit Economics
  - name: Optimize Usage and Cost
    capabilities:
      - Architecting for Cloud
      - Rate Optimization
      - Workload Optimization
      - Cloud Sustainability
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - FinOps Practice Operations
      - FinOps Education and Enablement
      - Invoicing and Chargeback
      - Onboarding Workloads
      - Intersecting Disciplines
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Credit
    - Adjustment
  chargeFrequency: Recurring
focusColumns:
  ServiceName: Schema Free
  ServiceCategory: Developer Tools / API
  ProviderName: Schema Free
  PublisherName: Schema Free
  InvoiceIssuerName: Schema Free
  PricingCategory: Usage-Based
  PricingUnit: request
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: api_requests
    description: Count of billable API requests
    unit: request
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - tier
      - region
      - consumer
  - name: data_egress
    description: Bytes returned over the network in API responses
    unit: GB
    aggregation: sum
    dimensions:
      - api
      - region
      - consumer
  - name: compute_seconds
    description: Server-side compute consumed by the request, where applicable
    unit: second
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - tier
apis:
  - name: MongoDB Atlas Data API
    baseURL: https://data.mongodb-api.com/app/{App ID}/endpoint/data/v1
    tags:
      - MongoDB
      - Document Store
      - NoSQL
      - Atlas
    serviceName: MongoDB Atlas Data API
    serviceCategory: API
  - name: Amazon DynamoDB API
    baseURL: https://dynamodb.us-east-1.amazonaws.com
    tags:
      - AWS
      - DynamoDB
      - NoSQL
      - Key-Value
      - Serverless
    serviceName: Amazon DynamoDB API
    serviceCategory: API
  - name: Elasticsearch REST API
    baseURL: https://localhost:9200
    tags:
      - Elasticsearch
      - Search
      - Document Store
      - Analytics
    serviceName: Elasticsearch REST API
    serviceCategory: API
  - name: Redis JSON API (RedisJSON)
    baseURL: https://your-redis-host:6379
    tags:
      - Redis
      - Key-Value
      - JSON
      - In-Memory
    serviceName: Redis JSON API (RedisJSON)
    serviceCategory: API
unitEconomics:
  - name: Cost per 1K Requests
    metric: billed_cost / (api_requests / 1000)
    target: TBD
  - name: Cost per Active Consumer
    metric: billed_cost / active_consumers
    target: TBD
