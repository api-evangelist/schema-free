# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-04'
tags:
  - Schema Free
  - Schemaless
  - NoSQL
  - Document Store
  - Flexible Schema
  - MongoDB
  - DynamoDB
  - Elasticsearch
